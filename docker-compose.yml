services:
  postgres:
    image: postgres:16-alpine
    container_name: financial-transactions-db
    environment:
      POSTGRES_DB: financial_transactions
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d financial_transactions"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: